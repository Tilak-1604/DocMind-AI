<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocMind AI - Google Auth Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f5f5f5;}
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        #responseArea { margin-top: 20px; padding: 15px; background: #eef; border-radius: 4px; overflow-x: auto; font-family: monospace; display: none; }
        .user-profile { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .user-profile img { border-radius: 50%; width: 50px; height: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Login to DocMind AI</h1>
    <p>Test Google Authentication</p>

    <!-- Google Sign-In button container -->
    <div id="g_id_onload"
         data-client_id="953881870828-va0i3pq91el796ragitm2pj70nmuo6mo.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>

    <div id="userInfo" style="display: none; margin-top: 20px;">
        <div class="user-profile">
            <img id="userPicture" src="" alt="User Profile">
            <div>
                <h3 id="userName" style="margin: 0;"></h3>
                <p id="userEmail" style="margin: 0; color: #666;"></p>
            </div>
        </div>
        <h4>JWT Token:</h4>
        <div id="responseArea"></div>
    </div>
</div>

<script>
    function handleCredentialResponse(response) {
        console.log("Encoded JWT ID token: " + response.credential);
        
        // Send to our backend
        fetch('/auth/google', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ idToken: response.credential })
        })
        .then(res => {
            if (!res.ok) {
                throw new Error("HTTP error " + res.status);
            }
            return res.json();
        })
        .then(data => {
            console.log("Success:", data);
            
            // Display User Info
            document.querySelector('.g_id_signin').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            
            document.getElementById('userPicture').src = data.user.picture;
            document.getElementById('userName').textContent = data.user.name;
            document.getElementById('userEmail').textContent = data.user.email;
            
            // Display Token
            const responseArea = document.getElementById('responseArea');
            responseArea.style.display = 'block';
            responseArea.textContent = data.token;
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Login failed. Check console for details.");
        });
    }
</script>

</body>
</html>
